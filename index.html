<script>
    let timerInterval;

    function checkPassword() {
        if (document.getElementById("password").value === "070815") {
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("navbar").style.display = "flex";
            showPage('lovePage');
        } else { document.getElementById("error").innerText = "Wrong password 😢"; }
    }
    
    function showPage(id) {
        if (document.getElementById("navbar").style.display === "none") return;
        document.querySelectorAll(".page").forEach(p => { p.style.display = "none"; p.style.opacity = "0"; });
        const target = document.getElementById(id);
        if(target) { target.style.display = "block"; setTimeout(() => { target.style.opacity = "1"; }, 50); }
    }

    function zoomImg(src) {
        if(!src || src.endsWith('/')) return;
        document.getElementById("modalImg").src = src;
        document.getElementById("modal").style.display = "flex";
    }

    // --- CLOCK LOGIC ---
    function updateClocks() {
        const ph = new Intl.DateTimeFormat('en-PH', { timeZone: 'Asia/Manila', timeStyle: 'medium' }).format(new Date());
        const sk = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Regina', timeStyle: 'medium' }).format(new Date());
        if(document.getElementById("phTime")) {
            document.getElementById("phTime").innerText = ph;
            document.getElementById("skTime").innerText = sk;
        }
    }
    setInterval(updateClocks, 1000);

    // --- TIMER LOGIC ---
    function saveTimerData() { 
        localStorage.setItem("targetDate", document.getElementById("targetDateInput").value); 
        localStorage.setItem("occasionName", document.getElementById("occasionInput").value);
        startTimer(); 
    }

    function resetTimer() {
        clearInterval(timerInterval);
        localStorage.removeItem("targetDate");
        localStorage.removeItem("occasionName");
        document.getElementById("targetDateInput").value = "";
        document.getElementById("occasionInput").value = "";
        document.getElementById("timerDisplay").innerText = "Set a date and occasion!";
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        const targetStr = localStorage.getItem("targetDate");
        const occasion = localStorage.getItem("occasionName") || "Our special day";
        if (!targetStr) return;
        timerInterval = setInterval(() => {
            const target = new Date(targetStr).getTime();
            const now = new Date().getTime();
            const diff = target - now;
            if (diff <= 0) {
                document.getElementById("timerDisplay").innerText = `${occasion} is here!`;
                clearInterval(timerInterval);
                return;
            }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById("timerDisplay").innerHTML = `<div>${occasion}</div><div style="font-size: 2.5rem;">${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s</div>`;
        }, 1000);
    }
    
    window.onload = () => { 
        if (localStorage.getItem("targetDate")) { 
            document.getElementById("targetDateInput").value = localStorage.getItem("targetDate");
            document.getElementById("occasionInput").value = localStorage.getItem("occasionName") || "";
            startTimer(); 
        } 
        updateClocks();
    };

    function openLetter() { 
        document.getElementById("envelope").style.display = "none"; 
        document.getElementById("letterContent").style.display = "block"; 
        const msg = "Hi pre? Babi? Baby? Yettobels? Nuricakes, bro? Boi? HAHAHAHA\n\n" +
                    "Hiii mahal ko, I am writing this letter for you to read before ikaw mag depart sa Philippines. From this day forward I want you to be strong okay?\n\n" +
                    "Nalulungkot parin ako to be honest kase sobrang bigat sa puso ko, pero it doesn't discourage me to pursue what i really want to be.\n\n" +
                    "We didn't have much time to get closure for each other before ikaw mag depart pero sa loob ng tatlong buwan, ng relationship natin, at sa loob ng walong buwan ng pagkakakilala sa isat isa, hinding hindi ko pinagsisihan na piliin ka sa mga panahon na alam kong mahirap dahil, alam kong parehas tayong unstable, at alam ko sa sarili ko na wlaang kasiguraduhan yung ginawa ko.\n\n" +
                    "I'm so proud of myself na, nag stay ako at pinili kita, sa mga panahon na alam kong walang tao ang magpapahalaga sayo ng tulad ng ginagawa ko sayo ngayon, I always hope na you wouldn't ruin my trust again sayo, Im starting to heal and reflect from what happened to us before, nagkamali ako at nagkamali karin, hindi ako nagsisi na pagbigyan ulit tong relationship natin na kahit sa oras na yon ay dapat nakong bumitaw, pero sa part na naalala ko kung saan tayo nag simula binigyan ako ng lakas non para piliin ka at ipaglaban muli ang relationship natin.\n\n" +
                    "Pano bayan? Ito na ang huling pahina na magkasama tayo, at sa pagbukas ng bagong pahina sa librong isinulat natin ito ay magkaiba sa mga nakaraan nating pahina sa librong ito, pero hindi ibig sabihin neto na ito na ang huling pagsasama natin, magkikita pa naman tayo, hindi ngayon, hindi bukas, hindi sa susunod na linggo, buwan, kundi sa susunod na taon.\n\n" +
                    "Wala ng hatid, sundo, kain tayo, punta ka bahay HAHAHAH sabay tayo punta, life would be so different mahal ko without you beside me, pero this bracelet na you give to me, the watch, necklace that you gave to me, made me feel like you're still here guiding me sa mga kalokohan na ginagawa ko HAHAHAHA sorry sa pagiging pasaway ko mahal.\n\n" +
                    "I will always keep you updated sa buhay ko here mahal ko and i hope you do the same rin, walang susuko ha? Call me pag you feel homesick and may problema ikaw, im always here listening to you.\n\n" +
                    "Iloveyousoomuch mahal ko, wala na talaga akong masabi sa totoo lang kase hindi ako ganon kagaling mga sulat ng mga ganto, pero hindi ko alam bakit pagdating sayo, nailalabas ko kung ano talaga yung nararamdaman ko, pagbutihin mo don mahal ko ha, Im always proud of you, \"Ill see you in the aisle\" Iloveyousoomuch mahal ko!\n\n" +
                    "Love you the most,\nFahudie Tumog. 💕";
                    
                    
        let i = 0; const t = document.getElementById("typedText"); 
        function type() { if (i < msg.length) { t.textContent += msg.charAt(i); i++; setTimeout(type, 10); } } 
        type(); 
    }
</script>
